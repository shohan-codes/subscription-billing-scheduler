services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: subscription_billing
            POSTGRES_USER: billing
            POSTGRES_PASSWORD: billing
        ports:
            - '5432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U billing -d subscription_billing']
            interval: 5s
            timeout: 5s
            retries: 10
        volumes:
            - postgres-data:/var/lib/postgresql/data

volumes:
    postgres-data:
