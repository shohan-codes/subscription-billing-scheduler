name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        env:
            NODE_ENV: test
            DATABASE_URL: postgresql://billing:billing@localhost:5432/subscription_billing

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: subscription_billing
                    POSTGRES_USER: billing
                    POSTGRES_PASSWORD: billing
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U billing -d subscription_billing"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run checks
              run: pnpm check

            - name: Run migrations
              run: pnpm db:migrate

            - name: Run e2e tests
              run: pnpm test:e2e
